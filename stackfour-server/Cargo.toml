[package]
name = "stackfour-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
random = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1.20"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.3", features = ["serde", "v4"] }
rand = "0.10.1"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
rapidhash = "4.4.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
axum-test = "20.1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid"] }
