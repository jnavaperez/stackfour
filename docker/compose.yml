services:
  frontend:
    build:
      dockerfile: ../docker/Dockerfile-react
      context: ../stackfour-react
      args:
        API_SERVER_INSTANCES_AMOUNT: 3
    deploy:
      replicas: 3
    ports:
      - "80"
    healthcheck:
      test: ["CMD-SHELL","wget --quiet --tries=1 --spider http://localhost/health/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 3
  backend:
    build:
      dockerfile: ../docker/Dockerfile-server
      context: ../stackfour-server
    deploy:
      replicas: 3
    ports:
      - "8081"
    # healthcheck:
    #   test: ["CMD-SHELL","wget --quiet --tries=1 --spider http://localhost:8081/health/ || exit 1"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 3
  loadbalance:
    image: nginx:latest
    volumes:
      - ../loadbalance/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "8081:8081"
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: uncle
      POSTGRES_PASSWORD: paul2
      POSTGRES_DB: data
    ports:
      - "5432:5432"
    volumes:
     - pgdata:/var/lib/postgresql

volumes:
  pgdata:


  